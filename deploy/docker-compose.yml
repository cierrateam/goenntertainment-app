# GÖ4Fun auf einem Server – alle Teile als Container.
#
#   Cloudflare ─► caddy (HTTPS on port 443 only, through the platform's load balancer)
#                   ├─► media (public uploads as plain files, read-only; holds no secrets)
#                   └─► api   (Laravel, api/)       the whole API, the uploads, the schema
#                   scheduler (the same image)      Laravel's schedule: subscriptions, credits, clean-up
#                   db  (MySQL)  ◄── api and the scheduler; the nightly backup (backup)
#
# Das Node-Backend (server/) läuft seit dem Marktplatz-Umbau nicht mehr mit: Laravel beantwortet
# alle Routen selbst und verwaltet auch das Schema (`php artisan migrate` beim Start des
# api-Containers, api/docker/entrypoint.sh). Von außen erreichbar ist nur Caddy.
#
# Networks (who can reach whom; the bottom of this file has the details):
#   edge      caddy <-> api. caddy's published port and api's mail go through here; caddy itself
#             calls out to nothing.
#   media     caddy <-> media. Internal: the file server has no way out and reaches nothing else.
#   app       api and scheduler -> db. Internal: no way out.
#   data      db <-> backup, admin-gate, seed. Internal.
#   outbound  the scheduler alone: its way out to the mail provider (credit reminders).
# caddy reaches neither the scheduler nor db, db has no way out, and caddy and api share exactly
# one network, so api sees caddy at one fixed address (F-31). api and the scheduler have fixed
# addresses as well: the host lets these two, and no other container, reach the metadata endpoint
# for the graph mailer's token (scripts/metadata-access.sh).
#
# Every setting without a default is required: docker compose refuses to start until deploy/.env
# sets it (deploy/.env.example lists them, with who decides each). Before the first start and
# before every update: deploy/scripts/preflight.sh. The first start creates the admin account
# with the one-off `seed` service before caddy may start (the `admin-gate` service); the steps
# are in deploy/README.md.
#
# No top-level `name`: docker compose names the project after this file's folder, `deploy`, as
# every earlier version of this file did, so a server that ran one keeps its volumes
# (deploy_db-data and the others).

# Every container's log is rotated by size (F-45): at most LOG_MAX_FILES files of LOG_MAX_SIZE
# each. How much log is kept is an operator decision, so both are required. Docker rotates by
# size, not by time.
x-logging: &logging
  driver: local
  options:
    max-size: ${LOG_MAX_SIZE:?LOG_MAX_SIZE is missing in deploy/.env (log retention, an operator decision; see deploy/.env.example)}
    max-file: ${LOG_MAX_FILES:?LOG_MAX_FILES is missing in deploy/.env (log retention, an operator decision; see deploy/.env.example)}

# The Laravel image: built once for api, the scheduler and the one-off seed service.
x-api-build: &api-build
  context: ../api
  additional_contexts:
    shared: ../shared

services:
  db:
    image: mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
    restart: unless-stopped
    # Checks MYSQL_BINLOG_RETENTION_DAYS, then starts the image's own entrypoint with it
    # (scripts/db-entrypoint.sh).
    entrypoint: ['bash', '/opt/deploy/db-entrypoint.sh']
    command: ['mysqld']
    environment:
      MYSQL_DATABASE: goenntertainment
      MYSQL_USER: goenn
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is missing in deploy/.env (see deploy/.env.example)}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is missing in deploy/.env (see deploy/.env.example)}
      # How many days MySQL keeps its binary log (every change, also of deleted accounts), or
      # `off`. A retention decision (F-45) without a default; MySQL's own would be 30 days. The
      # log is rotated every day (mysql/02-binlog-rotate.sql), so a change leaves it at most two
      # days after that many days.
      MYSQL_BINLOG_RETENTION_DAYS: ${MYSQL_BINLOG_RETENTION_DAYS:?MYSQL_BINLOG_RETENTION_DAYS is missing in deploy/.env (log retention, an operator decision; see deploy/.env.example)}
    volumes:
      # Die Tabellen legt Laravel beim Start von api an (php artisan migrate), nicht eine Datei hier.
      - db-data:/var/lib/mysql
      # On the first start (empty volume), as root: the daily rotation of the binary log (an
      # event; F-45). A volume created before this file needs it once: deploy/README.md, Logs.
      - ./mysql/02-binlog-rotate.sql:/docker-entrypoint-initdb.d/02-binlog-rotate.sql:ro
      - ./scripts/db-entrypoint.sh:/opt/deploy/db-entrypoint.sh:ro
    healthcheck:
      # No credentials (F-18): mysqladmin ping exits 0 as soon as the server answers, even when it
      # refuses the login, so no password ever appears on a command line or in the container's
      # configuration. -h 127.0.0.1: the image's first-start setup listens on its socket only.
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '--silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [app, data]
    # The image's entrypoint changes file owners and drops to the mysql user: default capabilities.
    security_opt: ['no-new-privileges:true']
    logging: *logging

  # Prepares the upload volumes (uploads, private-media), then exits.
  #
  # A new volume belongs to root. Laravel läuft aber absichtlich NICHT als root (Benutzer
  # `www-data`, UID 33) und könnte dort nichts speichern – jeder Upload scheiterte mit
  # „Serverfehler". This one-off container gives the folders in both volumes to www-data.
  #
  # Als Liste und in EINER Zeile: Als gefalteter Block (`>`) mit tiefer
  # eingerückten Folgezeilen behält YAML die Zeilenumbrüche – die Shell las
  # dann `/storage/offers` als eigenen Befehl und scheiterte am `&&` am
  # Zeilenanfang (`syntax error: unexpected "&&"`), und der ganze Stapel startete nicht.
  storage-init:
    image: busybox:1.38@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
    command:
      - sh
      - -c
      - mkdir -p /storage/avatars /storage/partners /storage/offers /storage-private/evidence && chown -R 33:33 /storage /storage-private
    volumes:
      - uploads:/storage
      # Evidence images (F-11, api/app/Support/Uploads.php): Laravel only, never a file server.
      - private-media:/storage-private
    network_mode: none
    security_opt: ['no-new-privileges:true']
    logging: *logging

  api:
    build: *api-build
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    environment:
      APP_NAME: GÖ4Fun
      APP_ENV: production
      # Niemals true auf dem Server: Laravel zeigte dann bei jedem Fehler
      # Quelltext, Pfade und Umgebungsvariablen – auch Passwörter.
      APP_DEBUG: 'false'
      APP_KEY: ${APP_KEY:?APP_KEY is missing in deploy/.env (see deploy/.env.example)}
      APP_URL: https://${DOMAIN:?DOMAIN is missing in deploy/.env (an operator decision; see deploy/.env.example)}
      PUBLIC_URL: https://${DOMAIN:?DOMAIN is missing in deploy/.env (an operator decision; see deploy/.env.example)}
      # UTC – MySQL läuft im Container ohnehin in UTC, und die API hängt an Zeiten
      # aus der Datenbank ein „Z" an. (Am Entwicklungs-PC steht APP_TIMEZONE auf
      # Europe/Berlin, weil MySQL dort in deutscher Ortszeit läuft.)
      APP_TIMEZONE: UTC
      APP_LOCALE: de
      APP_FALLBACK_LOCALE: de
      # Fehler landen in `docker compose logs api`, nicht in einer Datei im Container.
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: '3306'
      DB_DATABASE: goenntertainment
      DB_USERNAME: goenn
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is missing in deploy/.env (see deploy/.env.example)}
      # The only proxy Laravel takes the client address from: caddy's fixed address on the edge
      # network (below; deploy/test/static.test.mjs checks that both agree).
      TRUSTED_PROXIES: ${APP_NET_PREFIX:?APP_NET_PREFIX is missing in deploy/.env (see deploy/.env.example)}.10
      # database = rate-limit counters (sign-in, sign-up, password, 2FA, every write; per account
      #            and per address) in the `cache` table of the migrations: a file in the
      #            container loses increments under concurrent requests and resets on restart.
      # array = keine Sitzungen – die API arbeitet nur mit Tokens
      # sync  = Mails (2FA-Codes) gehen sofort raus, nicht über eine Warteschlange
      CACHE_STORE: database
      # Optional: access-token lifetime in minutes; empty = the default in code (30 days). The
      # scheduler reads the same setting for the retention prune (scripts/ci/check-mirrors.mjs
      # keeps both lines equal).
      SANCTUM_EXPIRATION: ${SANCTUM_EXPIRATION:-}
      # Optional overrides of the sign-in, sign-up, password and two-factor rate limits
      # (api/config/ratelimits.php); empty = the defaults in code, an invalid value stops the
      # api container's start.
      AUTH_LIMIT_REGISTER_IP: ${AUTH_LIMIT_REGISTER_IP:-}
      AUTH_LIMIT_REGISTER_ACCOUNT: ${AUTH_LIMIT_REGISTER_ACCOUNT:-}
      AUTH_LIMIT_LOGIN_ACCOUNT_IP: ${AUTH_LIMIT_LOGIN_ACCOUNT_IP:-}
      AUTH_LIMIT_LOGIN_IP: ${AUTH_LIMIT_LOGIN_IP:-}
      AUTH_LIMIT_LOGIN_ACCOUNT: ${AUTH_LIMIT_LOGIN_ACCOUNT:-}
      AUTH_LIMIT_FORGOT_IP: ${AUTH_LIMIT_FORGOT_IP:-}
      AUTH_LIMIT_FORGOT_ACCOUNT: ${AUTH_LIMIT_FORGOT_ACCOUNT:-}
      AUTH_LIMIT_RESET_IP: ${AUTH_LIMIT_RESET_IP:-}
      AUTH_LIMIT_RESET_ACCOUNT: ${AUTH_LIMIT_RESET_ACCOUNT:-}
      AUTH_LIMIT_2FA_CHALLENGE: ${AUTH_LIMIT_2FA_CHALLENGE:-}
      AUTH_LIMIT_2FA_IP: ${AUTH_LIMIT_2FA_IP:-}
      AUTH_LIMIT_2FA_ACCOUNT: ${AUTH_LIMIT_2FA_ACCOUNT:-}
      AUTH_LIMIT_2FA_RESEND_IP: ${AUTH_LIMIT_2FA_RESEND_IP:-}
      AUTH_LIMIT_2FA_RESEND_ACCOUNT: ${AUTH_LIMIT_2FA_RESEND_ACCOUNT:-}
      AUTH_LIMIT_2FA_SETUP_USER: ${AUTH_LIMIT_2FA_SETUP_USER:-}
      AUTH_LIMIT_ACCOUNT_SENSITIVE_USER: ${AUTH_LIMIT_ACCOUNT_SENSITIVE_USER:-}
      AUTH_LIMIT_PROFILE_USER: ${AUTH_LIMIT_PROFILE_USER:-}
      AUTH_LIMIT_2FA_FAILURES: ${AUTH_LIMIT_2FA_FAILURES:-}
      AUTH_LIMIT_LOCK_WAIT: ${AUTH_LIMIT_LOCK_WAIT:-}
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      # Zahlungen (api/config/club.php): `off` lehnt Käufe und Abos ab (503), `test` bucht ohne
      # echtes Geld. Echte Zahlungen kommen erst mit einem Zahlungsanbieter. Which one a server
      # runs is an operator decision without a default; the scheduler reads the same setting.
      PAYMENTS_MODE: ${PAYMENTS_MODE:?PAYMENTS_MODE is missing in deploy/.env (off or test, an operator decision; see deploy/.env.example)}
      # Mail: two-factor, password-reset and e-mail-change codes, and the credit reminders. How it
      # goes out is an operator decision without a default: `graph` (Microsoft Graph as the
      # server's managed identity, api/app/Mail/GraphTransport.php) or `smtp`. Never the log
      # mailer: it would write every code into the container log. Every line below must be in
      # deploy/.env, empty where the chosen way does not use it; the image's entrypoint stops the
      # start when one the chosen way needs is empty (api/docker/entrypoint.sh).
      MAIL_MAILER: ${MAIL_MAILER:?MAIL_MAILER is missing in deploy/.env (graph or smtp, an operator decision; see deploy/.env.example)}
      # Microsoft Graph: the client ID of the server's user-assigned managed identity (no secret).
      MAIL_GRAPH_CLIENT_ID: ${MAIL_GRAPH_CLIENT_ID?MAIL_GRAPH_CLIENT_ID is missing in deploy/.env (empty with MAIL_MAILER=smtp; see deploy/.env.example)}
      # SMTP: the provider. MAIL_USERNAME and MAIL_PASSWORD may be empty for a relay without login.
      MAIL_HOST: ${MAIL_HOST?MAIL_HOST is missing in deploy/.env (empty with MAIL_MAILER=graph; see deploy/.env.example)}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME?MAIL_USERNAME is missing in deploy/.env (empty is allowed for a relay without login; see deploy/.env.example)}
      MAIL_PASSWORD: ${MAIL_PASSWORD?MAIL_PASSWORD is missing in deploy/.env (empty is allowed for a relay without login; see deploy/.env.example)}
      MAIL_SCHEME: ${MAIL_SCHEME:-}
      # Never in clear text: STARTTLS (or smtps) or no mail at all (api/config/mail.php).
      MAIL_REQUIRE_TLS: 'true'
      # The sender of every mail; with graph, the mailbox the identity may send as.
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?MAIL_FROM_ADDRESS is missing in deploy/.env (the sender mailbox, an operator decision; see deploy/.env.example)}
      MAIL_FROM_NAME: GÖ4Fun
      # Nur dieser Container spielt Schema-Änderungen ein, nicht auch noch der scheduler – zwei
      # gleichzeitige `migrate` könnten sich in die Quere kommen (api/docker/entrypoint.sh).
      RUN_MIGRATIONS: 'true'
      # The uploads (F-29): Laravel is their only writer, into the two volumes below, mounted
      # outside Apache's docroot and outside /var/www, which Apache's own settings open.
      # Apache never serves them: media hands out the public ones behind caddy, and the evidence
      # images leave only through the admin route (api/config/filesystems.php).
      UPLOADS_ROOT: /var/lib/goenn/uploads
      PRIVATE_MEDIA_ROOT: /var/lib/goenn/private-media
    volumes:
      - uploads:/var/lib/goenn/uploads
      # Ban and timeout evidence: only Laravel's admin route reads it. Never mount this volume into
      # caddy, media or any other file server.
      - private-media:/var/lib/goenn/private-media
    healthcheck:
      # Checks the way to the database (/api/health asks MySQL), not only that Apache answers.
      # `php -r`: the image has no curl. Port 8080: Apache runs as www-data and cannot bind 80.
      # The start period covers the migrations, which run before Apache starts.
      test: ['CMD', 'php', '-r', 'exit(str_contains((string) @file_get_contents("http://127.0.0.1:8080/api/health"), "\"ok\":true") ? 0 : 1);']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      edge:
        # Fixed: the host lets this address and the scheduler's, and no other container, reach the
        # metadata endpoint for the graph mailer's token (scripts/metadata-access.sh).
        ipv4_address: ${APP_NET_PREFIX:?APP_NET_PREFIX is missing in deploy/.env (see deploy/.env.example)}.20
      app: {}
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    logging: *logging

  # Führt Laravels Zeitplan aus (api/routes/console.php): stündlich `club:renew` (Abos
  # verlängern, gekündigte auslaufen lassen, Monats-Credits), alle 5 Minuten `credits:expire`,
  # täglich `credits:remind` (Mails), stündlich `retention:prune` (F-16: abgelaufene
  # Anmeldedaten und alte Beweisbilder). Dasselbe Abbild wie api, ohne Apache.
  scheduler:
    build: *api-build
    restart: unless-stopped
    init: true
    command: ['php', 'artisan', 'schedule:work']
    depends_on:
      # Healthy means migrated: the scheduler never runs a job against a half-built schema.
      api:
        condition: service_healthy
    environment:
      APP_NAME: GÖ4Fun
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_KEY: ${APP_KEY:?APP_KEY is missing in deploy/.env (see deploy/.env.example)}
      APP_URL: https://${DOMAIN:?DOMAIN is missing in deploy/.env (an operator decision; see deploy/.env.example)}
      PUBLIC_URL: https://${DOMAIN:?DOMAIN is missing in deploy/.env (an operator decision; see deploy/.env.example)}
      APP_TIMEZONE: UTC
      APP_LOCALE: de
      APP_FALLBACK_LOCALE: de
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: '3306'
      DB_DATABASE: goenntertainment
      DB_USERNAME: goenn
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is missing in deploy/.env (see deploy/.env.example)}
      # The image's entrypoint requires it; the scheduler serves no request.
      TRUSTED_PROXIES: ${APP_NET_PREFIX:?APP_NET_PREFIX is missing in deploy/.env (see deploy/.env.example)}.10
      # The jobs' locks (withoutOverlapping) live in the database cache, as api's counters do.
      CACHE_STORE: database
      # The same token lifetime as api's (the retention prune counts from it).
      SANCTUM_EXPIRATION: ${SANCTUM_EXPIRATION:-}
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      # The same as api's: club renewals charge through it.
      PAYMENTS_MODE: ${PAYMENTS_MODE:?PAYMENTS_MODE is missing in deploy/.env (off or test, an operator decision; see deploy/.env.example)}
      # The same mail settings as api's (the credit reminders).
      MAIL_MAILER: ${MAIL_MAILER:?MAIL_MAILER is missing in deploy/.env (graph or smtp, an operator decision; see deploy/.env.example)}
      MAIL_GRAPH_CLIENT_ID: ${MAIL_GRAPH_CLIENT_ID?MAIL_GRAPH_CLIENT_ID is missing in deploy/.env (empty with MAIL_MAILER=smtp; see deploy/.env.example)}
      MAIL_HOST: ${MAIL_HOST?MAIL_HOST is missing in deploy/.env (empty with MAIL_MAILER=graph; see deploy/.env.example)}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME?MAIL_USERNAME is missing in deploy/.env (empty is allowed for a relay without login; see deploy/.env.example)}
      MAIL_PASSWORD: ${MAIL_PASSWORD?MAIL_PASSWORD is missing in deploy/.env (empty is allowed for a relay without login; see deploy/.env.example)}
      MAIL_SCHEME: ${MAIL_SCHEME:-}
      # Never in clear text: STARTTLS (or smtps) or no mail at all (api/config/mail.php).
      MAIL_REQUIRE_TLS: 'true'
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?MAIL_FROM_ADDRESS is missing in deploy/.env (the sender mailbox, an operator decision; see deploy/.env.example)}
      MAIL_FROM_NAME: GÖ4Fun
      # Retention in days (F-16, api/app/Support/Retention.php): how long evidence images and
      # expired sign-in data are kept. An operator decision: no defaults, and the prune refuses
      # to run without them.
      EVIDENCE_RETENTION_DAYS: ${EVIDENCE_RETENTION_DAYS:?EVIDENCE_RETENTION_DAYS is missing in deploy/.env (an operator decision, no default; see deploy/.env.example)}
      TOKEN_RETENTION_DAYS: ${TOKEN_RETENTION_DAYS:?TOKEN_RETENTION_DAYS is missing in deploy/.env (an operator decision, no default; see deploy/.env.example)}
      # The prune removes old evidence images: the private volume, as in api.
      PRIVATE_MEDIA_ROOT: /var/lib/goenn/private-media
    volumes:
      - private-media:/var/lib/goenn/private-media
    # The image checks Apache, which does not run in this container.
    healthcheck:
      disable: true
    networks:
      app: {}
      outbound:
        # Fixed, like api's: the host lets it reach the metadata endpoint (scripts/metadata-access.sh).
        ipv4_address: ${APP_NET_PREFIX:?APP_NET_PREFIX is missing in deploy/.env (see deploy/.env.example)}.140
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    logging: *logging

  caddy:
    image: caddy:2-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      # The public edge starts only once an admin account exists (F-05, scripts/admin-gate.sh).
      admin-gate:
        condition: service_completed_successfully
    ports:
      # 443 only, IPv4 only: Cloudflare reaches the server through the platform's load balancer,
      # and nothing listens on port 80 (no ACME, no redirect). The networks have no IPv6; IPv6
      # visitors reach Cloudflare, and their address arrives in CF-Connecting-IP (deploy/Caddyfile).
      - '0.0.0.0:443:443'
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is missing in deploy/.env (an operator decision; see deploy/.env.example)}
    networks:
      edge:
        # Fixed: api trusts the client address only from this one (TRUSTED_PROXIES).
        ipv4_address: ${APP_NET_PREFIX:?APP_NET_PREFIX is missing in deploy/.env (see deploy/.env.example)}.10
      media: {}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The origin certificate, its key and the origin-pull CA, from a folder on the host,
      # read-only (deploy/README.md, Origin certificate and Authenticated Origin Pulls). The long
      # syntax with create_host_path: false: a missing folder stops the start instead of becoming
      # an empty one.
      - type: bind
        source: ${ORIGIN_TLS_DIR:?ORIGIN_TLS_DIR is missing in deploy/.env (the folder with the origin certificate files; see deploy/.env.example)}
        target: /etc/caddy/origin
        read_only: true
        bind:
          create_host_path: false
      # Caddy's own state; no certificate lives here (the certificate is a file, there is no ACME).
      - caddy-data:/data
      - caddy-config:/config
      # No uploads volume: caddy follows symbolic links, so a link planted there would hand out
      # the origin key. The media service serves the uploads (deploy/Caddyfile.media).
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    # Runs as root in its image (it reads the root-owned key as its owner) and binds 443.
    cap_add: [NET_BIND_SERVICE]
    logging: *logging

  # The public uploads as plain files (deploy/Caddyfile.media), for caddy only: caddy forwards the
  # allow-listed /storage paths here and adds the security headers. A container of its own because
  # Caddy's file server follows symbolic links: one planted in the uploads volume resolves in here,
  # where there is nothing secret to read (no settings, no keys, empty temporary /data and /config).
  media:
    image: caddy:2-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    user: '65534:65534'
    read_only: true
    tmpfs: [/data, /config]
    volumes:
      - ./Caddyfile.media:/etc/caddy/Caddyfile:ro
      - uploads:/srv/storage:ro
    networks: [media]
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    # Port 8080 needs no privilege, but the image's caddy binary carries the file capability
    # cap_net_bind_service; without it in the bounding set, no-new-privileges refuses to start it.
    cap_add: [NET_BIND_SERVICE]
    logging: *logging

  # One-shot check before caddy starts: is there an admin account (scripts/admin-gate.sh)?
  admin-gate:
    image: mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
    entrypoint: ['bash', '/opt/deploy/admin-gate.sh']
    depends_on:
      db:
        condition: service_healthy
      # Healthy means migrated: the users table the gate counts exists.
      api:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_DATABASE: goenntertainment
      DB_USERNAME: goenn
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is missing in deploy/.env (see deploy/.env.example)}
    volumes:
      - ./scripts/admin-gate.sh:/opt/deploy/admin-gate.sh:ro
    tmpfs: [/tmp]
    networks: [data]
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    logging: *logging

  # Nightly backup of the database and the uploads, with pruning (F-17, scripts/backup.sh):
  # every day at 02:30 UTC and once at start, into BACKUP_DIR on the host. Only the nightly runs
  # delete old sets; the run at start deletes nothing.
  backup:
    image: mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
    restart: unless-stopped
    init: true
    entrypoint: ['bash', '/opt/deploy/backup.sh']
    # Laravel writes the evidence images readable for the owner and the www-data group only
    # (0640, api/config/filesystems.php). Root without capabilities reads them through that group.
    group_add: ['33']
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_DATABASE: goenntertainment
      DB_USERNAME: goenn
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is missing in deploy/.env (see deploy/.env.example)}
      # How many days a backup set is kept. An operator decision without a default.
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:?BACKUP_RETENTION_DAYS is missing in deploy/.env (backup retention, an operator decision; see deploy/.env.example)}
      TZ: UTC
    volumes:
      - ./scripts/backup.sh:/opt/deploy/backup.sh:ro
      - uploads:/data/uploads:ro
      - private-media:/data/private-media:ro
      # Outside the clone (deploy/scripts/preflight.sh checks it), so neither a fresh clone nor
      # a `git clean` takes the backups with it. Never created implicitly: a missing directory
      # stops the start instead of filling a new, empty one.
      - type: bind
        source: ${BACKUP_DIR:?BACKUP_DIR is missing in deploy/.env (an absolute path outside this clone, an operator decision; see deploy/.env.example)}
        target: /backups
        bind:
          create_host_path: false
    tmpfs: [/tmp]
    healthcheck:
      # Healthy while the last run succeeded within 26 hours and none failed since.
      test: ['CMD', 'bash', '/opt/deploy/backup.sh', '--check']
      interval: 10m
      timeout: 30s
      retries: 3
      start_period: 30m
    networks: [data]
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    logging: *logging

  # One-off: creates the admin account (`php artisan admin:create`, api/app/Support/
  # AdminAccount.php), before caddy may start. Never started by `docker compose up` (profile
  # tools); run it with `docker compose run --rm seed` as deploy/README.md shows. ADMIN_EMAIL and
  # ADMIN_PASSWORD come from the operator's shell for that one run: they are not in deploy/.env
  # and never in a long-running container (F-05, F-18). Exits 1 when either is missing, invalid
  # or the account exists. Laravel's command alone, without the image's entrypoint: it gets the
  # database settings and the two admin values, no key and no mail settings, and migrates nothing.
  seed:
    profiles: [tools]
    build: *api-build
    entrypoint: ['php', 'artisan', 'admin:create']
    depends_on:
      db:
        condition: service_healthy
      # Healthy means migrated: the users table exists.
      api:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_TIMEZONE: UTC
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: '3306'
      DB_DATABASE: goenntertainment
      DB_USERNAME: goenn
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is missing in deploy/.env (see deploy/.env.example)}
      ADMIN_EMAIL:
      ADMIN_PASSWORD:
    networks: [data]
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    logging: *logging

volumes:
  db-data:
  caddy-data:
  caddy-config:
  # Public uploads (avatars, partner logos and covers, offer images): api writes, media serves
  # (read-only).
  uploads:
  # Private media (ban and timeout evidence): api writes and reads it through the admin route,
  # the scheduler's retention prune removes old files; the backup reads it.
  private-media:

# APP_NET_PREFIX (the first three parts of a free private /24 on this host, see
# deploy/.env.example) holds the two networks with a way out, with fixed addresses:
#   edge      <prefix>.0/25    caddy at .10: Laravel trusts forwarding headers from it only
#                              (TRUSTED_PROXIES, F-31); api at .20. Other containers get .64-.127.
#   outbound  <prefix>.128/25  the scheduler at .140. Other containers get .192-.255.
# So no other container can take a fixed address. The host lets api's and the scheduler's
# addresses, and no other, reach the metadata endpoint (scripts/metadata-access.sh). The internal
# networks get their addresses from Docker. No network has IPv6 (see caddy's ports).
networks:
  edge:
    enable_ipv6: false
    ipam:
      config:
        - subnet: ${APP_NET_PREFIX:?APP_NET_PREFIX is missing in deploy/.env (see deploy/.env.example)}.0/25
          ip_range: ${APP_NET_PREFIX:?APP_NET_PREFIX is missing in deploy/.env (see deploy/.env.example)}.64/26
  media:
    internal: true
    enable_ipv6: false
  app:
    internal: true
    enable_ipv6: false
  data:
    internal: true
    enable_ipv6: false
  outbound:
    enable_ipv6: false
    ipam:
      config:
        - subnet: ${APP_NET_PREFIX:?APP_NET_PREFIX is missing in deploy/.env (see deploy/.env.example)}.128/25
          ip_range: ${APP_NET_PREFIX:?APP_NET_PREFIX is missing in deploy/.env (see deploy/.env.example)}.192/26
