# CI AND LOCAL TESTS ONLY - NOT FOR PRODUCTION. An override of docker-compose.yml for the
# automatic checks (.github/workflows/docker.yml, deploy/test/), always used with deploy/ci.env.
#
# What it changes, and why:
#   - every network is internal: the test stack reaches nothing outside this machine, not even
#     the internet (the edge loads the throw-away certificates the stack test makes for each run,
#     deploy/test/throwaway-pki.sh, through ORIGIN_TLS_DIR);
#   - caddy publishes no host port: tests reach it over the edge network, from the `probe`
#     service below, which plays Cloudflare;
#   - Mailpit catches every mail of api and the scheduler (no code ever lands in a log);
#   - the backups go to a throw-away volume instead of BACKUP_DIR.
# The two services this file adds (mailpit, probe) rotate their logs like every other container.
#
# Start command and settings for a local run: see the header of deploy/ci.env. The stack test
# (deploy/test/stack.test.mjs, `npm run test:deploy:stack`) builds, starts, checks and removes the
# whole stack with this file.

services:
  caddy:
    # !reset needs Compose >= 2.24.4.
    ports: !reset []

  api:
    environment:
      # CI has no real mail server: Mailpit catches every mail, so no code is ever written to a log.
      MAIL_HOST: mailpit
      MAIL_PORT: '1025'
      # Mailpit speaks plain SMTP; production requires TLS (docker-compose.yml).
      MAIL_REQUIRE_TLS: 'false'
    depends_on:
      mailpit:
        condition: service_healthy

  scheduler:
    environment:
      # The credit reminders' mails go to Mailpit as well.
      MAIL_HOST: mailpit
      MAIL_PORT: '1025'
      # Mailpit speaks plain SMTP; production requires TLS (docker-compose.yml).
      MAIL_REQUIRE_TLS: 'false'
    depends_on:
      mailpit:
        condition: service_healthy

  backup:
    volumes:
      # Replaces the BACKUP_DIR bind of docker-compose.yml (same target).
      - type: volume
        source: ci-backups
        target: /backups

  # The development mail catcher (pinned image), reused so the pin lives in one place. Its host
  # ports are dropped: api and the scheduler reach Mailpit over the app network.
  mailpit:
    extends:
      file: ../dev/docker-compose.yml
      service: mailpit
    ports: !reset []
    networks: [app]
    security_opt: ['no-new-privileges:true']
    logging:
      driver: local
      options:
        max-size: ${LOG_MAX_SIZE:?LOG_MAX_SIZE is missing in the env file (see deploy/ci.env)}
        max-file: ${LOG_MAX_FILES:?LOG_MAX_FILES is missing in the env file (see deploy/ci.env)}

  # Cloudflare's side of the stack test (deploy/test/probe.mjs): it sits on the edge network next
  # to caddy and reaches caddy only, presents the client certificate of Authenticated Origin Pulls
  # and sends the visitor's address in CF-Connecting-IP, the way Cloudflare's requests arrive at
  # caddy. Only with `--profile test`. Built from server/Dockerfile (the Node
  # image of the repository's server/, which the production stack no longer runs), so the Node
  # base image is pinned in that one file and Dependabot's update of it covers the probe as
  # well; only the entrypoint differs.
  probe:
    profiles: [test]
    build:
      context: ../server
      additional_contexts:
        shared: ../shared
    entrypoint: ['node', '/checks/probe.mjs']
    command: ['--idle']
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is missing in the env file (see deploy/ci.env)}
    volumes:
      - ./test:/checks:ro
    networks: [edge]
    user: node
    read_only: true
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    logging:
      driver: local
      options:
        max-size: ${LOG_MAX_SIZE:?LOG_MAX_SIZE is missing in the env file (see deploy/ci.env)}
        max-file: ${LOG_MAX_FILES:?LOG_MAX_FILES is missing in the env file (see deploy/ci.env)}

volumes:
  ci-backups:

networks:
  edge:
    internal: true
  outbound:
    internal: true
