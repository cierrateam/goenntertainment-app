# Baut die Container und prüft, dass sie zusammen funktionieren.
#
# Warum es das gibt: Die Container werden auf einem Linux-Server betrieben, und am
# Entwicklungs-PC ist Docker nicht installiert. Ohne diese Prüfung merkte man einen
# kaputten Bauplan erst beim Ausrollen. Hier läuft bei jedem Push dasselbe wie auf
# dem Server: Caddy included, but on networks closed to the outside, and then a real
# pass through Caddy.
#
# Two steps; README.md "Tests and checks" lists the same commands for a local run:
#   - the static deploy checks (npm run test:deploy): the compose files as docker compose
#     renders them, the Caddyfile as Caddy adapts it, the env files, the scripts and the
#     Dockerfiles; no stack is started;
#   - the stack test (npm run test:deploy:stack, deploy/test/stack.test.mjs): builds the images,
#     starts the whole stack with deploy/docker-compose.ci.yml and deploy/ci.env the way the
#     runbook's first start does (admin gate, one-off seed, then the edge), checks it through
#     caddy from a probe container on the edge network and from inside the containers, prints
#     the logs when a check failed, and removes the stack again. Every network is internal and
#     caddy publishes no port: nothing in the stack reaches anything outside the runner.
#
# Security: read-only token, actions pinned by commit SHA, no credentials in this file.
# All settings come from deploy/ci.env (public, fake, labelled ci-only); the stack test makes a
# fresh Laravel key for every run and never prints it, nor any password it makes. Pull requests
# from forks run this with the same read-only token and no secrets (there is no
# pull_request_target trigger).
name: Container

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Mirror of NODE_VERSION in ci.yml (scripts/ci/check-mirrors.mjs compares them).
  NODE_VERSION: '22'

jobs:
  deploy:
    name: Deploy (static checks and the running stack)
    runs-on: ubuntu-24.04
    # At least the sum of its steps' limits, so GitHub never cancels the job before the stack
    # test's after() and the log step have run: the static checks 10 min, the stack test 42 (its
    # file limit in package.json is 40 min, most of it for the first build of the api image and
    # the probe's), the logs 5, and 3 for checkout, setup and the counts. deploy/test/budgets.test.mjs
    # checks these numbers against each other and against the stack test's own budgets.
    timeout-minutes: 60
    env:
      # The project the stack test builds, starts and removes (required by the test), and whose
      # logs the log step prints.
      COMPOSE_PROJECT_NAME: goenn-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm install: the deploy tests need only Node's own modules and the Docker CLI.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Static deploy checks (npm run test:deploy)
        timeout-minutes: 10
        env:
          NODE_OPTIONS: --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=${{ runner.temp }}/deploy-static.tap
        run: npm run test:deploy
      - name: Static deploy check count
        if: ${{ !cancelled() }}
        run: node scripts/ci/test-report.mjs tap deploy-static "$RUNNER_TEMP/deploy-static.tap"

      - name: The running stack, through the edge (npm run test:deploy:stack)
        if: ${{ !cancelled() }}
        # Above the test file's own limit (package.json, 40 min), so the test runner, not GitHub,
        # ends a run that takes too long. That limit leaves room for the test's after(), which
        # prints the logs and removes the stack.
        timeout-minutes: 42
        env:
          NODE_OPTIONS: --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=${{ runner.temp }}/deploy-stack.tap
        run: npm run test:deploy:stack
      # A second copy of the logs that needs no after(): the stack test prints them itself when a
      # check fails, but not when it was stopped before its after() ran. Prints nothing once the
      # stack has been removed.
      - name: Stack logs after a failure
        if: ${{ failure() }}
        timeout-minutes: 5
        run: docker compose --project-directory deploy --env-file deploy/ci.env -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml --profile tools --profile test logs --no-color --tail 200
      - name: Stack check count
        if: ${{ !cancelled() }}
        run: node scripts/ci/test-report.mjs tap deploy-stack "$RUNNER_TEMP/deploy-stack.tap"
