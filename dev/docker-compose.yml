# Development only: a local mail catcher. Laravel (api/) sends every mail here instead of writing
# it to a log - 2FA codes and password-reset codes must never land in a log.
#
#   docker compose -f dev/docker-compose.yml up -d    -> inbox http://127.0.0.1:8025, SMTP 127.0.0.1:1025
#   docker compose -f dev/docker-compose.yml down
#
# Ports are bound to 127.0.0.1 only, so the codes are not reachable from the Wi-Fi. No restart
# policy: it runs only when started. Without Docker, the Mailpit binary does the same (README).
# deploy/docker-compose.ci.yml reuses this service (extends, without the host ports), so the image
# is pinned in one place.
name: goenn-dev

services:
  mailpit:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
